<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiny Quest</title>
<link rel="stylesheet" href="game.css">
</head>
<body>
<main>
 <p id="boot" class="card">Loading your adventure…</p>
 <section id="mapView" hidden>
  <canvas id="cv" width="1040" height="880" aria-label="Game map"></canvas>
  <div class="side">
  <div class="dash" id="hud"></div>
  <div id="status" aria-live="polite"></div>
  <div class="pad" id="pad">
   <button class="u" data-d="0,-1" aria-label="Up">▲</button>
   <button data-d="-1,0" aria-label="Left" style="grid-row:2">◀</button>
   <button data-d="0,1" aria-label="Down" style="grid-row:2">▼</button>
   <button data-d="1,0" aria-label="Right" style="grid-row:2">▶</button>
  </div>
  <p style="text-align:center;margin:10px 0 4px"><button id="quit">Save and exit to menu</button></p>
  <p class="muted" style="text-align:center">Arrow keys or WASD to move, hold to run. Bump into slimes, chests, and Bobo the merchant.</p>
  </div>
 </section>
 <section id="battleView" hidden></section>
 <section id="textView" hidden></section>
 <section id="pvpView" hidden>
  <canvas id="pvpCv" width="960" height="540" aria-label="PvP arena"></canvas>
  <p class="muted" id="pvpHelp" style="text-align:center;margin:0"></p>
  <div class="pvpPad" id="pvpPad">
   <div><button data-k="KeyA" aria-label="Left">◀</button><button data-k="KeyD" aria-label="Right">▶</button></div>
   <div><button data-k="KeyW" aria-label="Jump">▲</button><button data-k="KeyS" aria-label="Block">🛡</button><button data-k="KeyJ">J</button><button data-k="KeyK">K</button></div>
  </div>
  <div class="pvpBar"><button id="pvQuit">⬅ Leave arena</button><button id="pvPause">⏸ Pause</button><button id="pvAgain" class="primary" hidden>🔁 Rematch</button></div>
 </section>
 <p id="cloud" class="muted" style="text-align:center;margin-top:10px"></p>
</main>
<script src="env-check.js"></script>
<script src="game.js?v=20"></script>
<script src="pvp.js?v=5"></script>
<script type="module" src="auth-guard.js"></script>
</body>
</html>
