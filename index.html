<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiny Quest - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-background">

<div class="game-container">


    <div class="login-box">
        <h1>Log In</h1>
        <p>Continue your adventure!</p>

        <input type="email" id="username" placeholder="Email Address">

        <input type="password" id="password" placeholder="Password" >

        <button onclick="login()">
            Log In
        </button>

        <div class="divider">OR</div>

        <button class="create-btn" onclick="goToRegister()">
            Create Account
        </button>

        <p class="forgot" onclick="forgotPassword()">Forgot Password?</p>
    </div>

</div>

<script src="env-check.js"></script>
<script type="module" src="script.js"></script>

</body>

</html>
