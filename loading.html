<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tiny Quest - Loading</title>

    <link rel="stylesheet" href="loading.css">
</head>

<body>

    <div class="loading-screen">

        <!-- GAME TITLE -->
        <div class="game-title">
            <h1>Tiny Quest</h1>
            <h2>Forest of Slimes</h2>
        </div>


        <!-- GAME CHARACTERS -->
        <div class="characters">

            <div class="tree left-tree">🌲</div>

            <div class="kai">
                🧑‍🔧
            </div>

            <div class="slime">
                🟢
            </div>

            <div class="tree right-tree">🌳</div>

        </div>


        <!-- LOADING MESSAGE -->
        <div class="loading-message" id="loadingMessage">
            Entering the forest...
        </div>


        <!-- LOADING BAR -->
        <div class="loading-container">

            <div class="loading-bar">

                <div
                    class="loading-progress"
                    id="loadingProgress">
                </div>

            </div>

            <div class="loading-percent" id="loadingPercent">
                0%
            </div>

        </div>


        <p class="tip" id="loadingTip">
            Tip: Use the arrow keys or WASD to move Arlo.
        </p>

    </div>


    <script src="env-check.js"></script>
    <script type="module" src="loading-guard.js"></script>
    <script src="loading.js"></script>

</body>
</html>
